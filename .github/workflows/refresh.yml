name: refresh

# Regenerates README.md and models/ from the public examples feed every hour.
# The build job holds no credential: it fetches the feed, rebuilds, tests and
# hands the change to the commit job as a patch. The commit job installs and
# runs nothing but git and scripts/check_generated_paths.py, which accepts only
# generated paths, so a compromised generator cannot change what later runs execute.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-examples
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.diff.outputs.base }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Rebuild from the live feed
        run: python scripts/build_examples.py

      - name: Offline tests
        run: python -m unittest discover -s tests

      - name: Every generated file parses
        run: |
          set -e
          find models -name '*.py' -print0 | xargs -0 python -m py_compile
          find models -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Make the patch
        id: diff
        run: |
          set -e
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          find models -name '__pycache__' -type d -prune -exec rm -rf {} +
          git add -A -- README.md models
          if git diff --cached --quiet; then
            echo "no change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/check_generated_paths.py
          git diff --cached --binary > "$RUNNER_TEMP/refresh.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Hand the patch to the commit job
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-patch
          path: ${{ runner.temp }}/refresh.patch
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the commit the build ran on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.base }}

      - name: Take the patch from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refresh-patch
          path: ${{ runner.temp }}

      - name: Apply it, generated files only
        run: |
          set -e
          cp scripts/check_generated_paths.py "$RUNNER_TEMP/check_generated_paths.py"
          git apply --index "$RUNNER_TEMP/refresh.patch"
          python3 "$RUNNER_TEMP/check_generated_paths.py"

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh examples from the model catalog"
          git push origin HEAD:main
