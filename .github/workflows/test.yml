name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Offline tests
        run: python -m unittest discover -s tests
      - name: Every generated file parses
        run: |
          set -e
          find models -name '*.py' -print0 | xargs -0 python -m py_compile
          find models -name '*.sh' -print0 | xargs -0 -n1 bash -n
